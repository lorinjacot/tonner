[workspace]
members = [
    "storm",
    "glam-js",
    "storm-js",
]
resolver = "2"

[workspace.dependencies]
bytemuck = "1.24.0"
cfg_aliases = "0.1.0"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
glam = "0.30.8"
gloo = { version = "0.11.0", default-features = false }
js-sys = "0.3.82"
log = "0.4.28"
paste = "1.0"
pollster = "0.4.0"
serde = "1.0.228"
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.17"
tsify = "0.5.6"
uuid = "1.18.1"
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"
wasm-bindgen-test = "0.3.34"
web-sys = "0.3.81"
wgpu = "26.0.1"

storm = { path = "storm" }
glam-js = { path = "glam-js" }

[profile.release]
opt-level = "s"
