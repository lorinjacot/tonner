[workspace]
resolver = "2"
members = [
    "storm"
]

[workspace.dependencies]
cfg_aliases = "0.2.1"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
egui = "0.33.0"
egui-wgpu = "0.33.0"
log = "0.4.28"
storm = { path = "storm" }
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"
web-sys = "0.3.81"
wgpu = "27.0.1"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
