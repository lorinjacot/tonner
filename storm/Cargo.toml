[package]
name = "storm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
approx = "0.5.1"
bitflags = "2.9.1"
bytemuck = "1.22.0"
data-url = "0.3.1"
glam = { version = "0.30.2", features = ["bytemuck"] }
gltf = "1.4.1"
gltf-json = { version = "1.4.1", features = ["names"] }
image = { version = "0.25.6", default-features = false, features = ["hdr"] }
mikktspace-sys = "0.1.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_repr = "0.1.20"
thiserror = "2.0.12"
wgpu = { workspace = true }
