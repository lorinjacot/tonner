[package]
name = "lightning"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.94"
bitflags = "2.9.0"
bytemuck = { version = "1.20.0", features = ["derive"] }
egui = "0.31.0"
egui-wgpu = "0.31.0"
egui-winit = "0.31.0"
env_logger = "0.11.6"
glam = { version = "0.30.1", features = ["bytemuck"] }
gltf = { version = "1.4.1", features = ["names"] }
gltf-json = { version = "1.4.1", features = ["names"] }
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "hdr"] }
itertools = "0.14.0"
log = "0.4.22"
mikktspace-sys = "0.1.1"
pollster = "0.4.0"
profiling = { version = "1.0.16", features = ["profile-with-puffin"] }
puffin = "0.19.1"
puffin_http = "0.16.1"
thiserror = "2.0.9"
wgpu = "24.0.1"
winit = "0.30.5"
