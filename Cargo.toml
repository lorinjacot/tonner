[package]
name = "lightning"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.94"
bytemuck = { version = "1.20.0", features = ["derive"] }
egui = "0.30.0"
egui-wgpu = "0.30.0"
egui-winit = "0.30.0"
env_logger = "0.11.6"
glam = { version = "0.29.2", features = ["bytemuck"] }
gltf = "1.4.1"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "hdr"] }
log = "0.4.22"
pollster = "0.4.0"
profiling = { version = "1.0.16", features = ["profile-with-puffin"] }
puffin = "0.19.1"
puffin_http = "0.16.1"
thiserror = "2.0.9"
wgpu = "23.0.1"
winit = "0.30.5"
