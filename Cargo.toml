[workspace]
resolver = "2"
members = [
    "storm",
    "glam-js",
    "storm-js",
]

[workspace.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
glam = "0.30.8"
glam-js = { path = "glam-js" }
js-sys = "0.3.82"
log = "0.4.28"
paste = "1.0"
serde = "1.0.228"
serde-wasm-bindgen = "0.6.5"
storm = { path = "storm" }
thiserror = "2.0.17"
tsify = "0.5.6"
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"
wasm-bindgen-test = "0.3.34"
web-sys = "0.3.81"
wgpu = "27.0.1"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
