[workspace]
members = [
    "storm",
    "storm-animation",
    "storm-controls",
    "storm-gltf",
    "glam-js",
    "billiard",
    "lightning",
]
resolver = "2"

[workspace.dependencies]
approx = "0.5.1"
anyhow = "1.0.100"
bitflags = "2.10.0"
bytemuck = "1.24.0"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
data-url = "0.3.2"
dashmap = "6.1.0"
eframe = { version = "0.33.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11"
] }
egui = "0.33.3"
env_logger = "0.11.8"
image = "0.25.9"
glam = "0.30.8"
log = "0.4.28"
numpy = "0.28.0"
paste = "1.0"
pollster = "0.4.0"
pyo3 = "0.28.1"
pyo3-ffi = "0.28.1"
rfd = "0.16.0"
serde = "1.0.228"
serde_json = "1.0.149"
serde_repr = "0.1.20"
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.17"
tsify = "0.5.6"
uuid = "1.18.1"
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"
wasm-bindgen-test = "0.3.34"
web-sys = "0.3.81"
winit = "0.30.12"
wgpu = "27.0.1"

storm = { path = "storm" }
storm-animation = { path = "storm-animation" }
storm-controls = { path = "storm-controls" }
glam-js = { path = "glam-js" }

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
# opt-level = 2
